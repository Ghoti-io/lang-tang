# Continuous integration for ghoti.io-lang-tang.
#
# Everything here is a target the Makefile already has, run the way the
# project documents it (AD-16: the engines get compress-style CI once they
# have a body, which they have: both compilers, the JIT and nojit arms,
# ASan+UBSan, the torture modes, TSan, Valgrind, the fuzz corpus replayed, the
# ctang differential, a coverage floor and MSYS2 Windows). The point of the
# file is that they are all run, on every change, rather than when somebody
# remembers.
#
# The layout follows ../runtime-debug's workflow, which follows ../runtime-jit's,
# ../runtime-heap's, ../runtime-core's and ../compress's: the project is
# checked out into a subdirectory so that its dependencies can be cloned beside
# it rather than inside it, and all of them are installed into one prefix in
# the workspace, exactly the way ../bootstrap.sh does it locally. lang-tang
# depends on cutil, unicode, text (which brings chron and regex), runtime-core,
# runtime-heap, runtime-jit and runtime-debug, and the differential needs ctang
# built and installed first, which is why ctang is in the setup action's list
# before any runtime-* library. The steps common to every job are in
# .github/actions/setup. bison (3.8.2 or later) and flex generate the parser
# and the scanner.
#
# The JIT arm is the default build; the JIT=no arm is run by `make test`
# itself, in its own tree (test-nojit), and the WITH_DEBUG=no arm is its own
# job (test-nodebug). The arm64 backend runs under qemu and the Windows
# backend's compiled-code tests under wine; those need containers and are run
# by suite/tools/m1-prerelease.sh in the workspace, not here.
#
# This file has never run on a runner: there is none where it was written. It
# was checked offline - valid YAML, every make target it names exists, and
# every job's commands except the Windows job's were run against a fresh clone
# of the committed tree (dependencies installed into a scratch prefix by the
# suite's install.sh) - and the first push is its first run.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that is pushed twice in quick succession does not need the first
# run finished. Pull requests are cancelled; pushes to master are not, so that
# every commit on the branch keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PREFIX: ${{ github.workspace }}/.local
  PKG_CONFIG_PATH: ${{ github.workspace }}/.local/share/pkgconfig

jobs:
  # ---------------------------------------------------------------------------
  # The everyday gate: it builds, the symbols are namespaced, the tests pass,
  # the examples still compile, and what `make install` leaves behind can
  # actually be consumed.
  #
  # Both compilers, because -Werror is only as good as the warnings the
  # compiler in use happens to emit, and the two disagree about which ones
  # those are. Neither is pinned: whatever the runner image ships is a third
  # opinion on top of the GCC 14 the suite is developed against, and a warning
  # only one of them emits is still a warning worth reading. If that ever
  # becomes noise rather than signal, pin a version here rather than dropping
  # the job.
  # ---------------------------------------------------------------------------
  test:
    name: Build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            packages: ""
          - cc: clang
            cxx: clang++
            packages: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup
        with:
          packages: ${{ matrix.packages }}

      - name: Build
        working-directory: lang-tang
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # `make test` depends on this, but running it as its own step reports a
      # namespace regression as a namespace regression rather than as a test
      # failure at the bottom of a long log.
      - name: Symbol namespace gate
        working-directory: lang-tang
        run: make check-symbols CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # The stable/free labels, the include and NEEDED edges (AD-2), the flag
      # stamps and strict aliasing as gates, then the self-test that runs each
      # gate against a planted defect and a control. `make test` depends on
      # them; naming them here reports a layering regression as one.
      - name: Layering gates and their self-test
        working-directory: lang-tang
        run: make check-stamps check-aliasing check-labels check-edges check-gates CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: Tests
        working-directory: lang-tang
        run: make test -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # AD-26: the harness runs on every change and prints its calibration, so
      # a figure recorded later can be read against the machine it came from.
      - name: Benchmark harness
        working-directory: lang-tang
        run: make bench CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: Examples
        working-directory: lang-tang
        run: make examples CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # The tests reach the library through include/ and a static archive
      # linked with --whole-archive. A consumer reaches it through pkg-config,
      # the installed headers and the shared library, and nothing else here
      # exercises that path - which is where CONVENTIONS.md section 1 records
      # three defects that every in-tree build was blind to.
      - name: Install
        working-directory: lang-tang
        run: make install CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: A consumer can use what was installed
        working-directory: lang-tang
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} tools/check-install.sh "$PREFIX"

  # ---------------------------------------------------------------------------
  # ASan and UBSan, in their own build directory so the objects are never
  # shared with the plain build.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Tests under ASan and UBSan
        working-directory: lang-tang
        run: make test-asan -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # ThreadSanitizer, in a third build directory: it cannot share objects with
  # the ASan build because the two sanitizers cannot be combined.
  #
  # The profiler's timer thread, the host's request path and the engine's
  # fuel, deadline and cancellation checks are cross-thread (AD-4); the tests
  # that exercise them are what this job is for. ASan sees a use-after-free
  # only on a run where the timing produced one, and Valgrind's memcheck does
  # not look for races at all.
  # ---------------------------------------------------------------------------
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Tests under ThreadSanitizer
        working-directory: lang-tang
        run: make test-tsan -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # Valgrind finds what the sanitizers do not: uninitialised reads that happen
  # to be harmless, and leaks in code the sanitizers' interceptors do not see.
  # The -quiet variant is the one that treats a leak as a failure.
  # ---------------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup
        with:
          packages: valgrind

      - name: Build
        working-directory: lang-tang
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Tests under Valgrind
        working-directory: lang-tang
        run: make test-valgrind-quiet PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The gates are seen to fail. An instrument that has never been seen to find
  # a defect may be measuring nothing, so the planted-defect script builds the
  # engine with each of ten defects (a missing root, a missing gc_store, a
  # phase shuffle, a native that never polls, a wrong frame slot, a wrong
  # JIT instruction and so on) and requires the suite, the differential or a
  # gate to catch it, and to pass on the control. `check-gates` does the same
  # for the layering gates. `make test` runs the quick half of the former; the
  # two slow ones run under GC torture in the torture job.
  # ---------------------------------------------------------------------------
  gates:
    name: Gates seen to fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Build
        working-directory: lang-tang
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Layering gates, planted defects
        working-directory: lang-tang
        run: make check-gates PREFIX="$PREFIX"

      - name: The planted-defect script fails on a patch that breaks nothing
        working-directory: lang-tang
        run: make check-planted-selftest PREFIX="$PREFIX"

      - name: Planted defects, quick half
        working-directory: lang-tang
        run: make check-planted-quick PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The WITH_DEBUG=no arm: the library and its unit suites built in a tree of
  # their own, against a copy of the prefix from which runtime-debug and text
  # are taken away, which proves the library does not need them (AD-2). `make
  # test` does not run it. The JIT=no arm is not repeated here: `make test`
  # runs it itself (test-nojit), in its own tree, after the JIT build's suites.
  # ---------------------------------------------------------------------------
  nodebug:
    name: WITH_DEBUG=no
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Library without the debugger hosts
        working-directory: lang-tang
        run: make test-nodebug PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The torture modes (AD-16): the bounded suites with a collection at every
  # allocation and poll, freed cells poisoned, every pointer store checked
  # against its shadow, and the guest stack moved, under ASan and UBSan; and
  # the two slow planted defects (a missing root and a missing gc_store) that
  # prove torture catches them.
  # ---------------------------------------------------------------------------
  torture:
    name: GC torture and moving stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Suites under torture and verify
        working-directory: lang-tang
        run: make test-torture -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The parser, the template compiler and the interpreter take bytes from
  # outside, so each has a libFuzzer harness (clang with ASan and UBSan on this
  # library's own objects) and a seed corpus.
  #
  # Replay feeds every corpus file once through the entry point. It is a
  # regression test, not fuzzing: it is read-only, it fails on an empty corpus,
  # and `make test` runs it, but as its own job a corpus file that starts
  # crashing the parser is reported as that. The campaign is a short smoke run,
  # long enough to prove the harness still builds and still executes; a real
  # campaign wants a persistent corpus and hours (`make fuzz FUZZ_TIME=...`).
  # ---------------------------------------------------------------------------
  fuzz:
    name: Fuzz replay and smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup
        with:
          packages: clang

      - name: Build
        working-directory: lang-tang
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Corpus replay
        working-directory: lang-tang
        run: make fuzz-replay -j"$(nproc)" PREFIX="$PREFIX"

      - name: Fuzz for thirty seconds
        working-directory: lang-tang
        run: make fuzz FUZZ_TIME=30 PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # A floor, so that coverage can only be argued upward. Raise it when the
  # number rises; do not lower it to make a branch pass.
  #
  # It is a ratchet, not a target: the report counts every line of src/,
  # including platform branches a Linux runner cannot execute.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: ./lang-tang/.github/actions/setup

      - name: Line coverage
        working-directory: lang-tang
        run: make coverage -j"$(nproc)" COVERAGE_MIN=80 PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # Windows, natively, under MSYS2.
  #
  # This job exists so that the Windows arms are built and run, not guessed
  # at: every other job here is ubuntu-latest, so nothing else would stop a
  # commit from breaking the port silently. The differential drives ctang as a
  # child with fork and poll, so `test-oracle` is skipped on Windows by name
  # and ctang is not built here; everything lang-tang does alone with the
  # corpus runs. The JIT is the Windows x86-64 backend of runtime-jit; the
  # stack has run under wine (suite/tools/xwin/m1-run.sh in the workspace) and never
  # on a Windows machine, so this job's first run is the first time it is
  # built and run natively. bison and flex are the MSYS packages: the
  # generators run in the MSYS shell, the compiler is MinGW's.
  #
  # Notes on the shape, each of which is a thing that does not work otherwise:
  #
  # - `shell: msys2 {0}` on every step. The default shell on a Windows runner
  #   is PowerShell, and these recipes are POSIX shell.
  # - MSYS `make` and `diffutils`, not the MinGW ones. The recipes are POSIX
  #   shell, and every flag stamp uses `cmp`; without diffutils `cmp` is absent
  #   and the stamps never compare equal, so everything rebuilds every time.
  # - `binutils` comes with the gcc package; check-edges reads a DLL's imports
  #   with `objdump -p`, since there is no readelf-style NEEDED list on PE.
  # - `pkgconf` from the MINGW64 prefix rather than MSYS's own pkg-config,
  #   which cannot see MINGW64's .pc files - gtest included.
  # - PREFIX converted with `cygpath`. github.workspace is a Windows path
  #   (D:\a\...), and make, pkg-config and the recipes all want a POSIX one, so
  #   it is converted once here rather than in each recipe.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSYS2 MINGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lang-tang

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            bison
            flex
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-python

      - name: Resolve the prefix as a POSIX path
        run: |
          prefix="$(cygpath -u '${{ github.workspace }}')/.local"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/share/pkgconfig" >> "$GITHUB_ENV"

      # Unpinned, for the same reason the Linux setup action leaves them
      # unpinned, and in the order of suite/libraries.txt.
      - name: Build and install the dependencies
        run: |
          for dep in cutil unicode chron regex text runtime-core runtime-heap runtime-jit runtime-debug; do
            git clone --depth 1 "https://github.com/Ghoti-io/$dep.git" "deps/$dep"
            make -C "deps/$dep" -j"$(nproc)" PREFIX="$PREFIX"
            make -C "deps/$dep" install PREFIX="$PREFIX"
          done

      - name: Build
        working-directory: lang-tang
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Symbol namespace gate
        working-directory: lang-tang
        run: make check-symbols PREFIX="$PREFIX"

      - name: Tests
        working-directory: lang-tang
        run: make test -j"$(nproc)" PREFIX="$PREFIX"

      - name: Examples
        working-directory: lang-tang
        run: make examples PREFIX="$PREFIX"

      # The same argument as on Linux: the tests reach the library through
      # include/ and an archive, a consumer reaches it through pkg-config, the
      # installed headers and the DLL. On Windows the DLL also has to be found
      # at run time, which is a different mechanism from an rpath and so is
      # worth exercising here specifically.
      - name: Install
        working-directory: lang-tang
        run: make install PREFIX="$PREFIX"

      - name: A consumer can use what was installed
        working-directory: lang-tang
        run: tools/check-install.sh "$PREFIX"
